<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WORLD BUILDER Navigator</title>
<meta name="description" content="Route finding and GPS-style drive simulation on WORLD BUILDER maps.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles/main.css">
<link rel="stylesheet" href="styles/layout.css">
<link rel="stylesheet" href="styles/panels.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/navigator.css">
<script src="lib/lucide.min.js"></script>
<script src="lib/jszip.min.js"></script>
</head>
<body>
<div class="nav-app">
  <header class="topbar nav-top">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 2 4 21l8-4 8 4z" fill="none" stroke="#4B9DE8" stroke-width="2" stroke-linejoin="round"/></svg></span>
      <span class="brand-name">WORLD BUILDER</span>
      <span class="divider"></span>
      <span class="nav-title">Navigator</span>
      <span class="map-name" id="map-name"></span>
    </div>
    <div class="spacer"></div>
    <div class="top-actions">
      <button class="btn small" id="btn-open" title="Open a .world.json or .zip project"><i data-lucide="folder-open"></i>Open map</button>
      <button class="btn small" id="btn-editor-map" title="Load the map currently open in the editor (this browser)"><i data-lucide="refresh-cw"></i>Editor map</button>
      <button class="btn small" id="btn-sample"><i data-lucide="map"></i>Sample</button>
      <a class="btn small primary" href="./" title="Back to the map editor"><i data-lucide="pencil-ruler"></i>Editor</a>
    </div>
  </header>
  <aside class="nav-panel" id="nav-panel" aria-label="Route planner"></aside>
  <main class="nav-canvas" id="nav-canvas"></main>
  <footer class="statusbar nav-status">
    <span class="status-hint">Click the map to set stops · drag the map to pan · wheel to zoom · Space = run/pause · Esc = stop · Home = fit map</span>
    <span class="spacer"></span>
    <span class="status-item mono" id="nav-coords">X — Y —</span>
    <span class="status-item mono" id="nav-zoom"></span>
  </footer>
</div>
<div class="boot" aria-hidden="true">Loading Navigator…</div>
<script type="module" src="src/nav/navigator.js"></script>
</body>
</html>
