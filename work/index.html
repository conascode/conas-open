<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CONAS Work</title>
<style>
  :root { --bg:#f5f6fa; --fg:#1b1d23; --muted:#6b7080; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161b; --fg:#eceef3; --muted:#9aa0ad; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif; padding:16px; }
  h1 { font-size:1.5rem; margin:0 0 8px; }
  p { color:var(--muted); margin:0; }
</style>
</head>
<body>
  <main>
    <h1>새 작업 준비 중</h1>
    <p>이 폴더에 결과물이 올라올 예정입니다.</p>
  </main>
</body>
</html>
